<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" style="background:#0a0a0f;font-family:system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b7280"/>
    </marker>
    <marker id="arrowA" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22d3ee"/>
    </marker>
    <marker id="arrowE" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34d399"/>
    </marker>
    <marker id="arrowV" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="440" y="28" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">RSQ SKILL ROUTER — COMPONENT ARCHITECTURE</text>
  <text x="440" y="44" text-anchor="middle" fill="#6b7280" font-size="10">Eight modules · One CLI · Install once, route forever</text>

  <!-- ── CLI (top center) ── -->
  <rect x="290" y="62" width="300" height="56" rx="8" fill="#111118" stroke="#fbbf24" stroke-width="2"/>
  <text x="440" y="84" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">skill-router CLI</text>
  <text x="440" y="100" text-anchor="middle" fill="#6b7280" font-size="8">install · index · route · reconcile · status · activate · config · cron</text>
  <text x="440" y="112" text-anchor="middle" fill="#4b5563" font-size="7">Python 3.10+ · 8 commands · entry point</text>

  <!-- Agent trigger -->
  <rect x="12" y="70" width="120" height="28" rx="4" fill="#0a1618" stroke="#22d3ee" stroke-width="1"/>
  <text x="72" y="80" text-anchor="middle" fill="#22d3ee" font-size="9" font-weight="600">AGENT</text>
  <text x="72" y="92" text-anchor="middle" fill="#4b5563" font-size="6">reads SKILL.md</text>
  <line x1="132" y1="84" x2="288" y2="84" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowA)"/>

  <!-- ARROWS from CLI to modules -->
  <!-- Installer -->
  <line x1="330" y1="118" x2="100" y2="155" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Agent Detector -->
  <line x1="330" y1="118" x2="330" y2="155" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Indexer -->
  <line x1="440" y1="118" x2="440" y2="155" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Matcher -->
  <line x1="550" y1="118" x2="550" y2="155" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Vault Manager -->
  <line x1="550" y1="118" x2="780" y2="155" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ── ROW 1: MODULES ── -->
  <!-- Agent Detector -->
  <rect x="220" y="155" width="220" height="58" rx="6" fill="#0a1618" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="240" y="175" fill="#22d3ee" font-size="11" font-weight="600">agent_detector.py</text>
  <text x="240" y="192" fill="#9ca3af" font-size="8">Detects 11 agent frameworks</text>
  <text x="240" y="205" fill="#6b7280" font-size="7">Hermes · Claude Code · Codex · Cursor · Copilot · Windsurf · Cline · OpenClaw · Aider · Continue · Generic</text>

  <!-- Indexer -->
  <rect x="330" y="155" width="220" height="58" rx="6" fill="#111118" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="350" y="175" fill="#a78bfa" font-size="11" font-weight="600">indexer.py</text>
  <text x="350" y="192" fill="#9ca3af" font-size="8">Scans vault · extracts YAML frontmatter</text>
  <text x="350" y="205" fill="#6b7280" font-size="7">name · description · keywords · field · creator → index.json</text>

  <!-- Matcher -->
  <rect x="440" y="155" width="220" height="58" rx="6" fill="#1a1410" stroke="#fb923c" stroke-width="1.5"/>
  <text x="460" y="175" fill="#fb923c" font-size="11" font-weight="600">matcher.py</text>
  <text x="460" y="192" fill="#9ca3af" font-size="8">Intent → skill matching</text>
  <text x="460" y="205" fill="#6b7280" font-size="7">Weighted Jaccard · name×3 · keywords×2 · desc×1</text>

  <!-- Vault Manager -->
  <rect x="670" y="155" width="198" height="58" rx="6" fill="#1a1012" stroke="#fb7185" stroke-width="1.5"/>
  <text x="690" y="175" fill="#fb7185" font-size="11" font-weight="600">vault_manager.py</text>
  <text x="690" y="192" fill="#9ca3af" font-size="8">Symlink ops · atomic reconcile</text>
  <text x="690" y="205" fill="#6b7280" font-size="7">5 safety guarantees · activate/deactivate</text>

  <!-- ── ROW 2: MORE MODULES ── -->
  <!-- Installer -->
  <rect x="12" y="155" width="198" height="58" rx="6" fill="#1a1410" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="32" y="175" fill="#fbbf24" font-size="11" font-weight="600">installer.py</text>
  <text x="32" y="192" fill="#9ca3af" font-size="8">Interactive wizard</text>
  <text x="32" y="205" fill="#6b7280" font-size="7">Always-on picker · cron setup offer</text>

  <!-- Cron -->
  <rect x="440" y="228" width="220" height="50" rx="6" fill="#111118" stroke="#6b7280" stroke-width="1.5"/>
  <text x="460" y="248" fill="#9ca3af" font-size="11" font-weight="600">cron.py</text>
  <text x="460" y="265" fill="#6b7280" font-size="8">Background maintenance · 24h sweep · weekly report</text>

  <!-- SKILL.md (center) -->
  <rect x="290" y="310" width="300" height="52" rx="8" fill="#0a1618" stroke="#22d3ee" stroke-width="2"/>
  <text x="440" y="332" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="700">SKILL.md</text>
  <text x="440" y="350" text-anchor="middle" fill="#6b7280" font-size="8">Agent auto-loads this — runs reconcile on every turn — transparent to user</text>

  <!-- ── FILESYSTEM ── -->
  <rect x="12" y="384" width="856" height="104" rx="10" fill="#111118" stroke="#374151" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="24" y="374" fill="#4b5563" font-size="10" font-weight="600">FILESYSTEM — ~/.hermes/</text>

  <!-- skills-vault/ -->
  <rect x="30" y="398" width="200" height="76" rx="6" fill="#111118" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="46" y="420" fill="#a78bfa" font-size="11" font-weight="600">skills-vault/</text>
  <text x="46" y="438" fill="#6b7280" font-size="8">Read-only · 568 skills</text>
  <text x="46" y="454" fill="#6b7280" font-size="8">10 fields · never modified</text>
  <text x="46" y="468" fill="#4b5563" font-size="7">indexed by indexer.py</text>

  <!-- skills/ -->
  <rect x="248" y="398" width="240" height="76" rx="6" fill="#0a1a14" stroke="#34d399" stroke-width="2"/>
  <text x="264" y="420" fill="#34d399" font-size="11" font-weight="600">skills/</text>
  <text x="264" y="438" fill="#6b7280" font-size="8">Symlinks only · 5–15 active</text>
  <text x="264" y="454" fill="#6b7280" font-size="8">Agent reads from here</text>
  <text x="264" y="468" fill="#4b5563" font-size="7">managed by vault_manager.py</text>

  <!-- config.yaml -->
  <rect x="506" y="398" width="160" height="76" rx="6" fill="#1a1410" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="522" y="420" fill="#fbbf24" font-size="11" font-weight="600">config.yaml</text>
  <text x="522" y="438" fill="#6b7280" font-size="8">Always-on list</text>
  <text x="522" y="454" fill="#6b7280" font-size="8">Paths · matching</text>
  <text x="522" y="468" fill="#4b5563" font-size="7">written by installer</text>

  <!-- .cache/ -->
  <rect x="684" y="398" width="170" height="76" rx="6" fill="#111118" stroke="#6b7280" stroke-width="1.5"/>
  <text x="700" y="420" fill="#9ca3af" font-size="11" font-weight="600">.cache/</text>
  <text x="700" y="438" fill="#6b7280" font-size="8">index.json · usage.jsonl</text>
  <text x="700" y="454" fill="#6b7280" font-size="8">cron.log</text>
  <text x="700" y="468" fill="#4b5563" font-size="7">auto-generated</text>

  <!-- ARROWS module → filesystem -->
  <line x1="130" y1="213" x2="130" y2="396" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowV)"/>
  <line x1="440" y1="213" x2="370" y2="396" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowV)"/>
  <line x1="440" y1="362" x2="370" y2="396" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowE)"/>
  <line x1="550" y1="213" x2="590" y2="396" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="278" x2="770" y2="396" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowV)"/>

  <!-- ── LEGEND ── -->
  <line x1="12" y1="484" x2="868" y2="484" stroke="#1f2937" stroke-width="1"/>
  <text x="12" y="478" fill="#6b7280" font-size="8" font-weight="600">LEGEND</text>

  <rect x="12" y="480" width="14" height="8" rx="2" fill="#111118" stroke="#fbbf24" stroke-width="1"/>
  <text x="30" y="487" fill="#6b7280" font-size="7">CLI / entry point</text>

  <rect x="150" y="480" width="14" height="8" rx="2" fill="#111118" stroke="#a78bfa" stroke-width="1"/>
  <text x="168" y="487" fill="#6b7280" font-size="7">data / index processing</text>

  <rect x="320" y="480" width="14" height="8" rx="2" fill="#111118" stroke="#fb923c" stroke-width="1"/>
  <text x="338" y="487" fill="#6b7280" font-size="7">logic / intent matching</text>

  <rect x="490" y="480" width="14" height="8" rx="2" fill="#111118" stroke="#fb7185" stroke-width="1"/>
  <text x="508" y="487" fill="#6b7280" font-size="7">safety / file operations</text>

  <rect x="660" y="480" width="14" height="8" rx="2" fill="#111118" stroke="#22d3ee" stroke-width="1"/>
  <text x="678" y="487" fill="#6b7280" font-size="7">agent interface</text>

  <rect x="790" y="480" width="14" height="8" rx="2" fill="#111118" stroke="#6b7280" stroke-width="1"/>
  <text x="808" y="487" fill="#6b7280" font-size="7">background / cron</text>
</svg>