<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="960" height="520" fill="url(#grid)"/>

  <!-- CLI (top center) -->
  <rect x="380" y="20" width="200" height="50" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <rect x="380" y="20" width="200" height="50" rx="10" fill="rgba(120,53,15,0.2)"/>
  <text x="424" y="43" fill="#fbbf24" font-size="13" font-weight="600">skill-router CLI</text>
  <text x="424" y="59" fill="#94a3b8" font-size="8">8 commands: install, route, reconcile, ...</text>

  <!-- Installer (left top) -->
  <rect x="30" y="110" width="240" height="55" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="30" y="110" width="240" height="55" rx="8" fill="rgba(8,51,68,0.2)"/>
  <text x="50" y="133" fill="#22d3ee" font-size="11" font-weight="600">installer.py</text>
  <text x="50" y="150" fill="#94a3b8" font-size="8">Interactive wizard · agent detection · always-on picker</text>

  <!-- Agent Detector (left) -->
  <rect x="30" y="190" width="240" height="45" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="30" y="190" width="240" height="45" rx="8" fill="rgba(76,29,149,0.2)"/>
  <text x="50" y="212" fill="#a78bfa" font-size="11" font-weight="600">agent_detector.py</text>
  <text x="50" y="226" fill="#94a3b8" font-size="8">11 frameworks · auto-detect · skills dir resolution</text>

  <!-- Indexer (center-left) -->
  <rect x="320" y="120" width="240" height="55" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <rect x="320" y="120" width="240" height="55" rx="8" fill="rgba(6,78,59,0.2)"/>
  <text x="340" y="143" fill="#34d399" font-size="11" font-weight="600">indexer.py</text>
  <text x="340" y="159" fill="#94a3b8" font-size="8">Scans vault · extracts YAML frontmatter · builds index.json</text>

  <!-- Matcher (center-right) -->
  <rect x="320" y="200" width="240" height="55" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1.5"/>
  <rect x="320" y="200" width="240" height="55" rx="8" fill="rgba(251,146,60,0.2)"/>
  <text x="340" y="223" fill="#fb923c" font-size="11" font-weight="600">matcher.py</text>
  <text x="340" y="239" fill="#94a3b8" font-size="8">Keyword scoring · field signals · weighted Jaccard</text>

  <!-- Vault Manager (right) -->
  <rect x="620" y="120" width="280" height="55" rx="8" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
  <rect x="620" y="120" width="280" height="55" rx="8" fill="rgba(136,19,55,0.2)"/>
  <text x="640" y="143" fill="#fb7185" font-size="11" font-weight="600">vault_manager.py</text>
  <text x="640" y="159" fill="#94a3b8" font-size="8">Symlink ops · safety guarantees · usage logging</text>

  <!-- Cron (right) -->
  <rect x="620" y="200" width="280" height="55" rx="8" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="620" y="200" width="280" height="55" rx="8" fill="rgba(30,41,59,0.3)"/>
  <text x="640" y="223" fill="#94a3b8" font-size="11" font-weight="600">cron.py</text>
  <text x="640" y="239" fill="#94a3b8" font-size="8">24h sweep · weekly report · crontab setup</text>

  <!-- SKILL.md (bottom center) -->
  <rect x="330" y="300" width="300" height="55" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <rect x="330" y="300" width="300" height="55" rx="8" fill="rgba(8,51,68,0.15)"/>
  <text x="350" y="323" fill="#22d3ee" font-size="11" font-weight="600">SKILL.md</text>
  <text x="350" y="340" fill="#94a3b8" font-size="8">The router as an agent skill · auto-loads always</text>

  <!-- Filesystem layer (bottom) -->
  <rect x="130" y="400" width="700" height="80" rx="12" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="150" y="392" fill="#475569" font-size="10">FILESYSTEM</text>

  <rect x="160" y="415" width="200" height="45" rx="6" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <rect x="160" y="415" width="200" height="45" rx="6" fill="rgba(76,29,149,0.15)"/>
  <text x="180" y="435" fill="#a78bfa" font-size="10" font-weight="600">skills-vault/</text>
  <text x="180" y="450" fill="#64748b" font-size="7">Read-only source of truth</text>

  <rect x="420" y="415" width="200" height="45" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <rect x="420" y="415" width="200" height="45" rx="6" fill="rgba(6,78,59,0.15)"/>
  <text x="440" y="435" fill="#34d399" font-size="10" font-weight="600">skills/</text>
  <text x="440" y="450" fill="#64748b" font-size="7">Symlinks only · agent reads here</text>

  <rect x="680" y="415" width="130" height="45" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <rect x="680" y="415" width="130" height="45" rx="6" fill="rgba(120,53,15,0.15)"/>
  <text x="700" y="435" fill="#fbbf24" font-size="10" font-weight="600">config.yaml</text>
  <text x="700" y="450" fill="#64748b" font-size="7">Saved by installer</text>

  <!-- Arrows: CLI → modules -->
  <line x1="480" y1="70" x2="420" y2="120" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="480" y1="70" x2="435" y2="190" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="480" y1="70" x2="600" y2="190" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Arrows: modules → filesystem -->
  <line x1="300" y1="320" x2="350" y2="350" stroke="#94a3b8" stroke-width="1"/>
  <line x1="400" y1="320" x2="430" y2="350" stroke="#94a3b8" stroke-width="1"/>
  <line x1="500" y1="320" x2="510" y2="350" stroke="#94a3b8" stroke-width="1"/>
  <line x1="600" y1="320" x2="590" y2="350" stroke="#94a3b8" stroke-width="1"/>
</svg>