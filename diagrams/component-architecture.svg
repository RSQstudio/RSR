<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">RSQ Skill Router — Component Architecture</title>
  <desc id="desc">A dark terminal-style component architecture diagram for the RSQ Skill Router, showing agent input, CLI control plane, modules, and filesystem state.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#17233a" stroke-width="0.7"/></pattern>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b5873"/><stop offset="1" stop-color="#12314f"/></linearGradient>
    <linearGradient id="violetGlow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#46348b"/><stop offset="1" stop-color="#24285f"/></linearGradient>
    <linearGradient id="greenGlow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c604e"/><stop offset="1" stop-color="#123d44"/></linearGradient>
    <linearGradient id="amberGlow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b5317"/><stop offset="1" stop-color="#473419"/></linearGradient>
    <linearGradient id="roseGlow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#79233c"/><stop offset="1" stop-color="#421d38"/></linearGradient>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9Z" fill="#41d8ff"/></marker>
    <marker id="arrowViolet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9Z" fill="#b39cff"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9Z" fill="#55e6b0"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9Z" fill="#f5b94c"/></marker>
    <style>
      .sans{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.kicker{fill:#7f94b6;font-size:12px;font-weight:700;letter-spacing:2.3px}.title{fill:#eef5ff;font-size:29px;font-weight:700;letter-spacing:-.4px}.sub{fill:#9eb0ca;font-size:14px}.zone{fill:#0c172a;fill-opacity:.78;stroke:#293b58;stroke-width:1.2}.zoneTitle{fill:#d9e7fb;font-size:13px;font-weight:700;letter-spacing:1.2px}.zoneMeta{fill:#6f88ac;font-size:10px;letter-spacing:1.3px}.label{fill:#e8f0ff;font-size:14px;font-weight:650}.small{fill:#a6b9d5;font-size:11.5px}.tiny{fill:#7187aa;font-size:10px;letter-spacing:.6px}.tag{font-size:10px;font-weight:700;letter-spacing:1.1px}.edgeLabel{fill:#91a9cb;font-size:10px;letter-spacing:.8px}.rule{stroke:#29405f;stroke-width:1}.divider{stroke:#1e304c;stroke-width:1}.card{stroke-width:1.25}.num{fill:#96a8c3;font-size:11px;font-weight:700;letter-spacing:1.3px}
    </style>
  </defs>

  <rect width="1200" height="760" fill="#07101f"/><rect width="1200" height="760" fill="url(#grid)" opacity=".72"/>
  <rect x="20" y="20" width="1160" height="720" rx="18" fill="none" stroke="#20324f"/>
  <circle cx="58" cy="61" r="5" fill="#b39cff"/><text x="74" y="65" class="sans kicker">RSQ SKILL ROUTER / COMPONENT ARCHITECTURE</text>
  <text x="54" y="111" class="sans title">A small control plane for a large skill library.</text>
  <text x="54" y="138" class="sans sub">The router turns a natural-language task into a safe, bounded active context.</text>
  <line x1="54" y1="163" x2="1146" y2="163" class="rule"/>

  <!-- Connectors first. -->
  <path d="M338 241H405" fill="none" stroke="#41d8ff" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M600 318V351H175V381" fill="none" stroke="#b39cff" stroke-width="1.8" marker-end="url(#arrowViolet)"/>
  <path d="M600 318V351H387V381" fill="none" stroke="#b39cff" stroke-width="1.8" marker-end="url(#arrowViolet)"/>
  <path d="M600 318V351H600V381" fill="none" stroke="#b39cff" stroke-width="1.8" marker-end="url(#arrowViolet)"/>
  <path d="M600 318V351H813V381" fill="none" stroke="#b39cff" stroke-width="1.8" marker-end="url(#arrowViolet)"/>
  <path d="M600 318V351H1025V381" fill="none" stroke="#b39cff" stroke-width="1.8" marker-end="url(#arrowViolet)"/>
  <path d="M175 480V556" fill="none" stroke="#f5b94c" stroke-width="1.8" marker-end="url(#arrowAmber)"/>
  <path d="M387 480V556" fill="none" stroke="#55e6b0" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <path d="M600 480V556" fill="none" stroke="#b39cff" stroke-width="1.8" marker-end="url(#arrowViolet)"/>
  <path d="M813 480V556" fill="none" stroke="#55e6b0" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <path d="M1025 480V556" fill="none" stroke="#f5b94c" stroke-width="1.8" marker-end="url(#arrowAmber)"/>
  <path d="M282 615H493" fill="none" stroke="#55e6b0" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M707 615H918" fill="none" stroke="#55e6b0" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M1034 660C1110 653 1115 498 1025 480" fill="none" stroke="#91a6c5" stroke-width="1.3" stroke-dasharray="5 6" marker-end="url(#arrowAmber)"/>
  <text x="350" y="231" class="mono edgeLabel">RECONCILE</text><text x="1044" y="524" class="mono edgeLabel">SCHEDULE</text>
  <text x="331" y="605" class="mono edgeLabel">INDEX</text><text x="758" y="605" class="mono edgeLabel">ACTIVATE</text>

  <!-- Agent surface -->
  <rect x="54" y="196" width="284" height="90" rx="12" class="zone"/>
  <text x="75" y="220" class="mono num">AGENT SURFACE</text>
  <rect x="75" y="232" width="242" height="37" rx="8" fill="url(#cyanGlow)" stroke="#41d8ff" class="card"/>
  <text x="93" y="256" class="mono label">SKILL.md / PRE-TURN HOOK</text>
  <text x="75" y="282" class="sans small">Passes the current task to the router.</text>

  <!-- CLI control plane -->
  <rect x="405" y="196" width="390" height="122" rx="12" fill="#0c172a" fill-opacity=".9" stroke="#b39cff" stroke-width="1.4"/>
  <text x="429" y="221" class="mono num">CONTROL PLANE</text>
  <text x="429" y="251" class="sans zoneTitle">skill-router CLI</text>
  <text x="429" y="274" class="sans small">install · index · route · reconcile · activate · status · cron</text>
  <rect x="429" y="286" width="342" height="17" rx="4" fill="#25275f"/>
  <text x="441" y="298" class="mono tiny">LIMITS · DRY-RUN SUPPORT · SAFETY CHECKS</text>

  <!-- Modules zone -->
  <rect x="54" y="351" width="1092" height="159" rx="14" class="zone"/>
  <text x="77" y="377" class="mono num">CORE MODULES</text>
  <line x1="77" y1="390" x2="1123" y2="390" class="divider"/>
  <rect x="77" y="401" width="196" height="79" rx="9" fill="url(#amberGlow)" stroke="#f5b94c" class="card"/>
  <text x="95" y="426" class="mono label">AGENT DETECTOR</text><text x="95" y="446" class="sans small">Selects active + vault paths.</text><text x="95" y="466" class="mono tiny">agent_detector.py</text>
  <rect x="289" y="401" width="196" height="79" rx="9" fill="url(#greenGlow)" stroke="#55e6b0" class="card"/>
  <text x="307" y="426" class="mono label">INDEXER</text><text x="307" y="446" class="sans small">Extracts skill metadata.</text><text x="307" y="466" class="mono tiny">indexer.py</text>
  <rect x="502" y="401" width="196" height="79" rx="9" fill="url(#violetGlow)" stroke="#b39cff" class="card"/>
  <text x="520" y="426" class="mono label">MATCHER</text><text x="520" y="446" class="sans small">Scores task intent to skills.</text><text x="520" y="466" class="mono tiny">matcher.py</text>
  <rect x="715" y="401" width="196" height="79" rx="9" fill="url(#roseGlow)" stroke="#ff7e9b" class="card"/>
  <text x="733" y="426" class="mono label">VAULT MANAGER</text><text x="733" y="446" class="sans small">Creates and removes links only.</text><text x="733" y="466" class="mono tiny">vault_manager.py</text>
  <rect x="928" y="401" width="196" height="79" rx="9" fill="url(#amberGlow)" stroke="#f5b94c" class="card"/>
  <text x="946" y="426" class="mono label">INSTALLER + CRON</text><text x="946" y="446" class="sans small">Setup, sweep, usage reports.</text><text x="946" y="466" class="mono tiny">installer.py · cron.py</text>

  <!-- Persistent state -->
  <rect x="54" y="536" width="1092" height="160" rx="14" class="zone"/>
  <text x="77" y="562" class="mono num">PERSISTENT STATE</text>
  <text x="1123" y="562" text-anchor="end" class="mono zoneMeta">LOCAL FILESYSTEM BOUNDARY</text>
  <line x1="77" y1="575" x2="1123" y2="575" class="divider"/>
  <rect x="77" y="588" width="205" height="73" rx="9" fill="url(#greenGlow)" stroke="#55e6b0" class="card"/>
  <text x="95" y="614" class="mono label">skills-vault/</text><text x="95" y="634" class="sans small">Full library · read-only source.</text><text x="95" y="652" class="mono tiny">NEVER MODIFIED</text>
  <rect x="289" y="588" width="205" height="73" rx="9" fill="url(#amberGlow)" stroke="#f5b94c" class="card"/>
  <text x="307" y="614" class="mono label">index.json</text><text x="307" y="634" class="sans small">Searchable metadata cache.</text><text x="307" y="652" class="mono tiny">~/.cache/skill-router/</text>
  <rect x="502" y="588" width="205" height="73" rx="9" fill="url(#violetGlow)" stroke="#b39cff" class="card"/>
  <text x="520" y="614" class="mono label">config.yaml</text><text x="520" y="634" class="sans small">Paths · limits · retained skills.</text><text x="520" y="652" class="mono tiny">~/.config/skill-router/</text>
  <rect x="715" y="588" width="205" height="73" rx="9" fill="url(#cyanGlow)" stroke="#41d8ff" class="card"/>
  <text x="733" y="614" class="mono label">active skills/</text><text x="733" y="634" class="sans small">Bounded task-specific symlinks.</text><text x="733" y="652" class="mono tiny">AGENT LOADS FROM HERE</text>
  <rect x="928" y="588" width="196" height="73" rx="9" fill="#132036" stroke="#58708f" class="card"/>
  <text x="946" y="614" class="mono label">usage.jsonl</text><text x="946" y="634" class="sans small">Operational activity log.</text><text x="946" y="652" class="mono tiny">WEEKLY REPORT INPUT</text>

  <line x1="54" y1="716" x2="1146" y2="716" class="rule"/>
  <text x="54" y="732" class="mono tiny">SAFETY INVARIANT: ACTIVATE NEW LINKS BEFORE DEACTIVATING OLD ONES. REFUSE TO TOUCH REAL SKILL FILES.</text>
</svg>
