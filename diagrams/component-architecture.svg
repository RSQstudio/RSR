<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560">
      <defs>
        <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern>
        <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
        <marker id="ac" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/></marker>
        <marker id="ae" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#34d399"/></marker>
        <marker id="av" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#a78bfa"/></marker>
      </defs>
      <rect width="1080" height="560" fill="url(#g)"/>

      <!-- ── CLI ENTRY ── -->
      <rect x="340" y="20" width="400" height="70" rx="10" fill="rgba(120,53,15,.12)" stroke="#fbbf24" stroke-width="2"/>
      <text x="430" y="48" fill="#fbbf24" font-size="13" font-weight="700">skill-router CLI</text>
      <text x="430" y="66" fill="#94a3b8" font-size="9">install · index · route · reconcile · status · activate · config · cron</text>
      <text x="430" y="80" fill="#64748b" font-size="7">Entry point · Python 3.10+ · 8 commands</text>

      <!-- Agent trigger -->
      <text x="30" y="48" fill="#22d3ee" font-size="10" font-weight="600">AGENT</text>
      <text x="30" y="63" fill="#94a3b8" font-size="8">reads SKILL.md</text>
      <text x="30" y="78" fill="#64748b" font-size="7">runs reconcile</text>
      <line x1="130" y1="60" x2="338" y2="60" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ac)"/>

      <!-- ── MODULES ROW ── -->
      <!-- Agent Detector -->
      <rect x="20" y="125" width="240" height="72" rx="8" fill="rgba(8,51,68,.12)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="36" y="150" fill="#22d3ee" font-size="11" font-weight="600">agent_detector.py</text>
      <text x="36" y="168" fill="#94a3b8" font-size="8">Detects 11 agent frameworks</text>
      <text x="36" y="182" fill="#64748b" font-size="7">Hermes · Claude Code · Codex · Cursor · Copilot · Windsurf · Cline · OpenClaw · Aider · Continue · Generic</text>

      <!-- Indexer -->
      <rect x="280" y="125" width="240" height="72" rx="8" fill="rgba(76,29,149,.12)" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="296" y="150" fill="#a78bfa" font-size="11" font-weight="600">indexer.py</text>
      <text x="296" y="168" fill="#94a3b8" font-size="8">Scans vault · YAML frontmatter → keywords</text>
      <text x="296" y="182" fill="#64748b" font-size="7">Builds index.json · name · description · keywords · field · creator</text>

      <!-- Matcher -->
      <rect x="540" y="125" width="240" height="72" rx="8" fill="rgba(251,146,60,.12)" stroke="#fb923c" stroke-width="1.5"/>
      <text x="556" y="150" fill="#fb923c" font-size="11" font-weight="600">matcher.py</text>
      <text x="556" y="168" fill="#94a3b8" font-size="8">Intent → skill matching</text>
      <text x="556" y="182" fill="#64748b" font-size="7">Weighted Jaccard · name×3 · keywords×2 · desc×1 · field signals</text>

      <!-- Vault Manager -->
      <rect x="800" y="125" width="260" height="72" rx="8" fill="rgba(136,19,55,.1)" stroke="#fb7185" stroke-width="1.5"/>
      <text x="816" y="150" fill="#fb7185" font-size="11" font-weight="600">vault_manager.py</text>
      <text x="816" y="168" fill="#94a3b8" font-size="8">Symlink ops · atomic reconcile</text>
      <text x="816" y="182" fill="#64748b" font-size="7">5 safety guarantees · usage logging · activate/deactivate</text>

      <!-- Installer -->
      <rect x="280" y="215" width="240" height="60" rx="8" fill="rgba(120,53,15,.08)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="296" y="240" fill="#fbbf24" font-size="11" font-weight="600">installer.py</text>
      <text x="296" y="256" fill="#94a3b8" font-size="8">Interactive wizard · always-on picker</text>
      <text x="296" y="269" fill="#64748b" font-size="7">Auto-detects agent · asks what to keep · offers cron setup</text>

      <!-- Cron -->
      <rect x="540" y="215" width="240" height="60" rx="8" fill="rgba(30,41,59,.2)" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="556" y="240" fill="#94a3b8" font-size="11" font-weight="600">cron.py</text>
      <text x="556" y="256" fill="#94a3b8" font-size="8">Background maintenance</text>
      <text x="556" y="269" fill="#64748b" font-size="7">24h sweep · weekly report · crontab setup</text>

      <!-- SKILL.md -->
      <rect x="340" y="310" width="400" height="60" rx="10" fill="rgba(8,51,68,.12)" stroke="#22d3ee" stroke-width="2"/>
      <text x="430" y="336" fill="#22d3ee" font-size="12" font-weight="600">SKILL.md</text>
      <text x="430" y="354" fill="#94a3b8" font-size="9">Agent auto-loads this · runs reconcile on every turn · transparent to user</text>

      <!-- ── FILESYSTEM ── -->
      <rect x="20" y="400" width="1040" height="130" rx="12" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,4"/>
      <text x="35" y="388" fill="#475569" font-size="10" font-weight="600">FILESYSTEM — ~/.hermes/</text>

      <!-- skills-vault/ -->
      <rect x="50" y="418" width="290" height="90" rx="8" fill="rgba(76,29,149,.08)" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="68" y="444" fill="#a78bfa" font-size="12" font-weight="600">skills-vault/</text>
      <text x="68" y="464" fill="#64748b" font-size="8">Read-only · 568 skills · 10 fields</text>
      <text x="68" y="480" fill="#64748b" font-size="8">Organized by domain (coding/, finance/…)</text>
      <text x="68" y="498" fill="#a78bfa" font-size="7">indexed by indexer.py · never modified</text>

      <!-- skills/ -->
      <rect x="370" y="418" width="310" height="90" rx="8" fill="rgba(6,78,59,.12)" stroke="#34d399" stroke-width="2"/>
      <text x="388" y="444" fill="#34d399" font-size="12" font-weight="600">skills/</text>
      <text x="388" y="464" fill="#64748b" font-size="8">Symlinks only · 5–15 active · agent reads here</text>
      <text x="388" y="480" fill="#64748b" font-size="8">Managed by vault_manager.py</text>
      <text x="388" y="498" fill="#34d399" font-size="7">never contains real files · atomic reconcile</text>

      <!-- config.yaml -->
      <rect x="710" y="418" width="160" height="90" rx="8" fill="rgba(120,53,15,.06)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="728" y="444" fill="#fbbf24" font-size="12" font-weight="600">config.yaml</text>
      <text x="728" y="464" fill="#64748b" font-size="8">Always-on list</text>
      <text x="728" y="480" fill="#64748b" font-size="8">Paths & settings</text>
      <text x="728" y="498" fill="#fbbf24" font-size="7">written by installer</text>

      <!-- .cache/ -->
      <rect x="900" y="418" width="145" height="90" rx="8" fill="rgba(30,41,59,.2)" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="918" y="444" fill="#94a3b8" font-size="12" font-weight="600">.cache/</text>
      <text x="918" y="464" fill="#64748b" font-size="8">index.json</text>
      <text x="918" y="480" fill="#64748b" font-size="8">usage.jsonl</text>
      <text x="918" y="498" fill="#94a3b8" font-size="7">cron.log</text>

      <!-- ── ARROWS: CLI → modules ── -->
      <line x1="400" y1="90" x2="130" y2="123" stroke="#64748b" stroke-width="1" marker-end="url(#a)"/>
      <line x1="400" y1="90" x2="400" y2="123" stroke="#64748b" stroke-width="1" marker-end="url(#a)"/>
      <line x1="620" y1="90" x2="650" y2="123" stroke="#64748b" stroke-width="1" marker-end="url(#a)"/>
      <line x1="620" y1="90" x2="920" y2="123" stroke="#64748b" stroke-width="1" marker-end="url(#a)"/>
      <line x1="400" y1="90" x2="400" y2="213" stroke="#64748b" stroke-width="1" marker-end="url(#a)"/>
      <line x1="620" y1="90" x2="650" y2="213" stroke="#64748b" stroke-width="1" marker-end="url(#a)"/>

      <!-- SKILL.md → filesystem ops -->
      <line x1="540" y1="370" x2="540" y2="416" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="460" y1="370" x2="190" y2="416" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#av)"/>
      <line x1="540" y1="370" x2="525" y2="416" stroke="#34d399" stroke-width="1.5" marker-end="url(#ae)"/>
      <line x1="620" y1="370" x2="790" y2="416" stroke="#64748b" stroke-width="1" marker-end="url(#a)"/>

      <!-- ── LEGEND ── -->
      <text x="50" y="550" fill="#94a3b8" font-size="9" font-weight="600">LEGEND</text>
      <rect x="50" y="558" width="16" height="8" rx="2" fill="rgba(120,53,15,.12)" stroke="#fbbf24" stroke-width="1"/>
      <text x="72" y="565" fill="#94a3b8" font-size="7">cli entry</text>
      <rect x="140" y="558" width="16" height="8" rx="2" fill="rgba(76,29,149,.12)" stroke="#a78bfa" stroke-width="1"/>
      <text x="162" y="565" fill="#94a3b8" font-size="7">data/index</text>
      <rect x="250" y="558" width="16" height="8" rx="2" fill="rgba(251,146,60,.12)" stroke="#fb923c" stroke-width="1"/>
      <text x="272" y="565" fill="#94a3b8" font-size="7">matching</text>
      <rect x="360" y="558" width="16" height="8" rx="2" fill="rgba(136,19,55,.1)" stroke="#fb7185" stroke-width="1"/>
      <text x="382" y="565" fill="#94a3b8" font-size="7">safety/ops</text>
      <rect x="480" y="558" width="16" height="8" rx="2" fill="rgba(8,51,68,.12)" stroke="#22d3ee" stroke-width="1"/>
      <text x="502" y="565" fill="#94a3b8" font-size="7">agent interface</text>
      <rect x="620" y="558" width="16" height="8" rx="2" fill="rgba(30,41,59,.2)" stroke="#94a3b8" stroke-width="1"/>
      <text x="642" y="565" fill="#94a3b8" font-size="7">cron/bg</text>
    </svg>