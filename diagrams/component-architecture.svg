<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620">
        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
          <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
          <marker id="arrowEmerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)"/>

        <!-- ── ARROWS (behind everything) ── -->

        <!-- CLI → modules -->
        <line x1="360" y1="108" x2="120" y2="185" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="360" y1="108" x2="280" y2="250" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="450" y1="108" x2="540" y2="185" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="450" y1="108" x2="670" y2="185" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="500" y1="108" x2="850" y2="185" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- Module → filesystem ops -->
        <line x1="220" y1="310" x2="220" y2="430" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowEmerald)"/>
        <line x1="450" y1="310" x2="450" y2="430" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowEmerald)"/>
        <line x1="550" y1="310" x2="550" y2="430" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowEmerald)"/>
        <line x1="750" y1="310" x2="750" y2="430" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow)"/>
        <line x1="880" y1="310" x2="880" y2="430" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow)"/>

        <!-- Agent → CLI flow -->
        <text x="40" y="55" fill="#94a3b8" font-size="9">Agent triggers:</text>
        <text x="40" y="69" fill="#22d3ee" font-size="8">skill-router reconcile</text>
        <line x1="170" y1="62" x2="290" y2="62" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowCyan)"/>

        <!-- ── TOP: CLI ── -->
        <rect x="290" y="40" width="280" height="80" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
        <rect x="290" y="40" width="280" height="80" rx="10" fill="rgba(120,53,15,0.12)"/>
        <text x="335" y="70" fill="#fbbf24" font-size="14" font-weight="700">skill-router CLI</text>
        <text x="335" y="90" fill="#94a3b8" font-size="9">Entry point · 8 commands · Python 3.10+</text>
        <text x="335" y="106" fill="#64748b" font-size="8">install | index | route | reconcile | status | activate | config | cron</text>

        <!-- ── ROW 2: MODULES ── -->

        <!-- Agent Detector -->
        <rect x="30" y="185" width="220" height="70" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
        <rect x="30" y="185" width="220" height="70" rx="8" fill="rgba(8,51,68,0.18)"/>
        <text x="50" y="210" fill="#22d3ee" font-size="12" font-weight="600">agent_detector.py</text>
        <text x="50" y="228" fill="#94a3b8" font-size="9">Detects 11 agent frameworks:</text>
        <text x="50" y="244" fill="#64748b" font-size="8">Hermes · Claude Code · Codex · Cursor · Copilot · Windsurf · Cline · OpenClaw · Aider · Continue · Generic</text>

        <!-- Indexer -->
        <rect x="280" y="250" width="240" height="65" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
        <rect x="280" y="250" width="240" height="65" rx="8" fill="rgba(76,29,149,0.18)"/>
        <text x="300" y="275" fill="#a78bfa" font-size="12" font-weight="600">indexer.py</text>
        <text x="300" y="293" fill="#94a3b8" font-size="9">Scans vault · extracts YAML frontmatter · builds index.json</text>

        <!-- Matcher -->
        <rect x="540" y="185" width="240" height="70" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1.5"/>
        <rect x="540" y="185" width="240" height="70" rx="8" fill="rgba(251,146,60,0.15)"/>
        <text x="560" y="210" fill="#fb923c" font-size="12" font-weight="600">matcher.py</text>
        <text x="560" y="228" fill="#94a3b8" font-size="9">Keyword-weighted scoring:</text>
        <text x="560" y="244" fill="#64748b" font-size="8">Name ×3 · Keywords ×2 · Description ×1 · Field-level intent signals</text>

        <!-- Vault Manager -->
        <rect x="800" y="185" width="250" height="70" rx="8" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
        <rect x="800" y="185" width="250" height="70" rx="8" fill="rgba(136,19,55,0.12)"/>
        <text x="820" y="210" fill="#fb7185" font-size="12" font-weight="600">vault_manager.py</text>
        <text x="820" y="228" fill="#94a3b8" font-size="9">Symlink-only operations · 5 safety guarantees · atomic reconcile · usage logging</text>

        <!-- Installer -->
        <rect x="540" y="270" width="240" height="55" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
        <rect x="540" y="270" width="240" height="55" rx="8" fill="rgba(120,53,15,0.1)"/>
        <text x="560" y="294" fill="#fbbf24" font-size="12" font-weight="600">installer.py</text>
        <text x="560" y="310" fill="#94a3b8" font-size="9">Interactive wizard · always-on picker · cron setup offer</text>

        <!-- Cron -->
        <rect x="800" y="270" width="250" height="55" rx="8" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
        <rect x="800" y="270" width="250" height="55" rx="8" fill="rgba(30,41,59,0.2)"/>
        <text x="820" y="294" fill="#94a3b8" font-size="12" font-weight="600">cron.py</text>
        <text x="820" y="310" fill="#94a3b8" font-size="9">24h sweep: auto-vault · weekly report: usage + token savings</text>

        <!-- SKILL.md -->
        <rect x="290" y="595" width="300" height="70" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
        <rect x="290" y="595" width="300" height="70" rx="8" fill="rgba(8,51,68,0.15)"/>
        <text x="310" y="620" fill="#22d3ee" font-size="12" font-weight="600">SKILL.md → Agent auto-loads always</text>
        <text x="310" y="640" fill="#94a3b8" font-size="9">Agent reads this → runs reconcile on every turn · transparent to user</text>

        <!-- ── BOTTOM: FILESYSTEM ── -->
        <rect x="30" y="390" width="1020" height="120" rx="14" fill="transparent" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,4"/>
        <text x="50" y="380" fill="#475569" font-size="11" font-weight="600">FILESYSTEM — ~/.hermes/</text>

        <!-- Vault dir -->
        <rect x="60" y="410" width="280" height="80" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
        <rect x="60" y="410" width="280" height="80" rx="8" fill="rgba(76,29,149,0.1)"/>
        <text x="80" y="435" fill="#a78bfa" font-size="12" font-weight="600">skills-vault/</text>
        <text x="80" y="453" fill="#64748b" font-size="8">Read-only · 568 skills · 10 fields</text>
        <text x="80" y="468" fill="#64748b" font-size="8">Organized by domain (coding, finance...)</text>
        <text x="80" y="483" fill="#a78bfa" font-size="7">Indexed by indexer.py</text>

        <!-- Active dir -->
        <rect x="370" y="410" width="300" height="80" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
        <rect x="370" y="410" width="300" height="80" rx="8" fill="rgba(6,78,59,0.15)"/>
        <text x="390" y="435" fill="#34d399" font-size="12" font-weight="600">skills/</text>
        <text x="390" y="453" fill="#64748b" font-size="8">Symlinks only · 5–15 active · agent reads here</text>
        <text x="390" y="468" fill="#64748b" font-size="8">Managed by vault_manager.py</text>
        <text x="390" y="483" fill="#34d399" font-size="7">Never contains real files</text>

        <!-- Config -->
        <rect x="700" y="410" width="170" height="80" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
        <rect x="700" y="410" width="170" height="80" rx="8" fill="rgba(120,53,15,0.08)"/>
        <text x="720" y="435" fill="#fbbf24" font-size="12" font-weight="600">config.yaml</text>
        <text x="720" y="453" fill="#64748b" font-size="8">Always-on list</text>
        <text x="720" y="468" fill="#64748b" font-size="8">Path configuration</text>
        <text x="720" y="483" fill="#fbbf24" font-size="7">Written by installer</text>

        <!-- Cache -->
        <rect x="895" y="410" width="140" height="80" rx="8" fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>
        <rect x="895" y="410" width="140" height="80" rx="8" fill="rgba(30,41,59,0.2)"/>
        <text x="915" y="435" fill="#94a3b8" font-size="12" font-weight="600">.cache/</text>
        <text x="915" y="453" fill="#64748b" font-size="8">index.json</text>
        <text x="915" y="468" fill="#64748b" font-size="8">usage.jsonl</text>
        <text x="915" y="483" fill="#94a3b8" font-size="7">cron.log</text>

        <!-- SKILL.md → Filesystem boundary -->
        <line x1="440" y1="595" x2="440" y2="520" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- ── LEGEND ── -->
        <text x="50" y="545" fill="#e2e8f0" font-size="10" font-weight="600">Legend</text>
        <rect x="50" y="553" width="16" height="10" rx="2" fill="rgba(120,53,15,0.12)" stroke="#fbbf24" stroke-width="1"/>
        <text x="72" y="561" fill="#94a3b8" font-size="8">CLI / Entry Point</text>
        <rect x="200" y="553" width="16" height="10" rx="2" fill="rgba(76,29,149,0.18)" stroke="#a78bfa" stroke-width="1"/>
        <text x="222" y="561" fill="#94a3b8" font-size="8">Data Processing</text>
        <rect x="350" y="553" width="16" height="10" rx="2" fill="rgba(251,146,60,0.15)" stroke="#fb923c" stroke-width="1"/>
        <text x="372" y="561" fill="#94a3b8" font-size="8">Logic / Scoring</text>
        <rect x="500" y="553" width="16" height="10" rx="2" fill="rgba(136,19,55,0.12)" stroke="#fb7185" stroke-width="1"/>
        <text x="522" y="561" fill="#94a3b8" font-size="8">Safety / Ops</text>
        <rect x="650" y="553" width="16" height="10" rx="2" fill="rgba(8,51,68,0.18)" stroke="#22d3ee" stroke-width="1"/>
        <text x="672" y="561" fill="#94a3b8" font-size="8">Agent Interface</text>
        <rect x="800" y="553" width="16" height="10" rx="2" fill="rgba(30,41,59,0.2)" stroke="#94a3b8" stroke-width="1"/>
        <text x="822" y="561" fill="#94a3b8" font-size="8">Background / Cron</text>
      </svg>