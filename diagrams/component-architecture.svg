<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540">

  <!-- Background -->
  <rect width="980" height="540" fill="#0f172a"/>

  <style>
    .node.storage { fill: #0f766e; }
    .node.process { fill: #4338ca; }
    .node.input { fill: #1d4ed8; }
    .node.external { fill: #92400e; }
    .node.neutral { fill: #334155; }
    .node.risk { fill: #991b1b; }
    .zone { fill: #1e293b; stroke: #334155; stroke-width: 1; }
    .edge { stroke: #94a3b8; fill: none; }
    .label { fill: #e5e7eb; font-family: system-ui, sans-serif; font-size: 14px; }
    .small { fill: #a3adbd; font-family: system-ui, sans-serif; font-size: 11px; }
    .title { fill: #e5e7eb; font-family: system-ui, sans-serif; font-size: 18px; font-weight: bold; }
  </style>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#94a3b8"/></marker>
  </defs>

  <!-- ── EDGES (behind nodes) ── -->

  <!-- Agent → CLI -->
  <path d="M 140,56 L 310,56" class="edge" stroke-dasharray="5,4" marker-end="url(#a)"/>

  <!-- CLI → modules -->
  <path d="M 430,112 L 50,182" class="edge" marker-end="url(#a)"/>
  <path d="M 430,112 L 180,182" class="edge" marker-end="url(#a)"/>
  <path d="M 500,112 L 370,182" class="edge" marker-end="url(#a)"/>
  <path d="M 500,112 L 550,182" class="edge" marker-end="url(#a)"/>
  <path d="M 500,112 L 730,182" class="edge" marker-end="url(#a)"/>
  <path d="M 500,112 L 900,182" class="edge" marker-end="url(#a)"/>

  <!-- Module → Filesystem -->
  <path d="M 50,235 L 50,390" class="edge" marker-end="url(#a)"/>
  <path d="M 230,235 L 230,390" class="edge" marker-end="url(#a)"/>
  <path d="M 410,235 L 290,390" class="edge" marker-end="url(#a)"/>
  <path d="M 410,235 L 460,390" class="edge" marker-end="url(#a)"/>
  <path d="M 590,235 L 630,390" class="edge" marker-end="url(#a)"/>
  <path d="M 780,235 L 800,390" class="edge" marker-end="url(#a)"/>
  <path d="M 920,235 L 920,390" class="edge" marker-end="url(#a)"/>

  <!-- SKILL.md → filesystem -->
  <path d="M 460,330 L 460,388" class="edge" stroke-dasharray="5,4" marker-end="url(#a)"/>

  <!-- ── TITLE ── -->
  <text x="490" y="30" text-anchor="middle" class="title">RSQ Skill Router · Component Architecture</text>

  <!-- Agent -->
  <rect x="30" y="40" width="110" height="32" rx="6" class="node input"/>
  <text x="85" y="60" text-anchor="middle" class="label">AGENT</text>

  <!-- CLI -->
  <rect x="310" y="80" width="340" height="64" rx="8" class="node external"/>
  <text x="480" y="102" text-anchor="middle" class="label">skill-router CLI</text>
  <text x="480" y="120" text-anchor="middle" class="small">install · index · route · reconcile · status · activate · config · cron</text>
  <text x="480" y="136" text-anchor="middle" class="small">Python 3.10+ · 8 commands · entry point</text>

  <!-- ── ROW 1: MODULES ── -->
  <rect x="22" y="182" width="160" height="65" rx="6" class="node input"/>
  <text x="38" y="202" class="label">agent_detector.py</text>
  <text x="38" y="220" class="small">Auto-detects 11 frameworks</text>
  <text x="38" y="236" class="small">Hermes · Claude · Codex · Cursor…</text>

  <rect x="192" y="182" width="160" height="65" rx="6" class="node storage"/>
  <text x="208" y="202" class="label">indexer.py</text>
  <text x="208" y="220" class="small">Scans vault · builds index</text>
  <text x="208" y="236" class="small">name · desc · keywords → json</text>

  <rect x="362" y="182" width="160" height="65" rx="6" class="node process"/>
  <text x="378" y="202" class="label">matcher.py</text>
  <text x="378" y="220" class="small">Intent → skill scoring</text>
  <text x="378" y="236" class="small">name×3 · keywords×2 · desc×1</text>

  <rect x="532" y="182" width="160" height="65" rx="6" class="node process"/>
  <text x="548" y="202" class="label">installer.py</text>
  <text x="548" y="220" class="small">Interactive wizard</text>
  <text x="548" y="236" class="small">Always-on picker · cron setup</text>

  <rect x="702" y="182" width="160" height="65" rx="6" class="node risk"/>
  <text x="718" y="202" class="label">vault_manager.py</text>
  <text x="718" y="220" class="small">Symlink ops · reconcile</text>
  <text x="718" y="236" class="small">5 safety rules · never touches files</text>

  <rect x="872" y="182" width="90" height="65" rx="6" class="node neutral"/>
  <text x="888" y="202" class="label">cron.py</text>
  <text x="888" y="220" class="small">sweep</text>
  <text x="888" y="236" class="small">report</text>

  <!-- SKILL.md -->
  <rect x="370" y="288" width="240" height="52" rx="8" class="node input"/>
  <text x="490" y="310" text-anchor="middle" class="label">SKILL.md</text>
  <text x="490" y="328" text-anchor="middle" class="small">Agent auto-loads · runs reconcile every turn</text>

  <!-- ── FILESYSTEM ZONE ── -->
  <rect x="20" y="370" width="940" height="150" rx="8" class="zone"/>

  <!-- skills-vault/ -->
  <rect x="40" y="400" width="190" height="80" rx="6" class="node storage"/>
  <text x="56" y="422" class="label">skills-vault/</text>
  <text x="56" y="438" class="small">568 skills · 10 fields</text>
  <text x="56" y="454" class="small">Read-only · never modified</text>
  <text x="56" y="470" class="small">indexed by indexer.py</text>

  <!-- skills/ -->
  <rect x="250" y="400" width="190" height="80" rx="6" class="node storage"/>
  <text x="266" y="422" class="label">skills/</text>
  <text x="266" y="438" class="small">Symlinks only · 5–15 active</text>
  <text x="266" y="454" class="small">Agent reads from here</text>
  <text x="266" y="470" class="small">managed by vault_manager</text>

  <!-- config.yaml -->
  <rect x="460" y="400" width="160" height="80" rx="6" class="node external"/>
  <text x="476" y="422" class="label">config.yaml</text>
  <text x="476" y="438" class="small">Always-on list</text>
  <text x="476" y="454" class="small">Paths · matching</text>
  <text x="476" y="470" class="small">Saved by installer</text>

  <!-- .cache/ -->
  <rect x="640" y="400" width="160" height="80" rx="6" class="node neutral"/>
  <text x="656" y="422" class="label">.cache/</text>
  <text x="656" y="438" class="small">index.json</text>
  <text x="656" y="454" class="small">usage.jsonl</text>
  <text x="656" y="470" class="small">cron.log</text>

  <!-- ~/.hermes/ label -->
  <text x="490" y="395" text-anchor="middle" class="small">FILESYSTEM · ~/.hermes/</text>

  <!-- ── LEGEND ── -->
  <rect x="20" y="526" width="14" height="10" rx="2" class="node input"/>
  <text x="40" y="535" class="small">agent / installer</text>
  <rect x="160" y="526" width="14" height="10" rx="2" class="node storage"/>
  <text x="180" y="535" class="small">data / index</text>
  <rect x="280" y="526" width="14" height="10" rx="2" class="node process"/>
  <text x="300" y="535" class="small">logic / matching</text>
  <rect x="420" y="526" width="14" height="10" rx="2" class="node risk"/>
  <text x="440" y="535" class="small">safety / operations</text>
  <rect x="580" y="526" width="14" height="10" rx="2" class="node external"/>
  <text x="600" y="535" class="small">config / entry</text>
  <rect x="720" y="526" width="14" height="10" rx="2" class="node neutral"/>
  <text x="740" y="535" class="small">background / cron</text>
</svg>