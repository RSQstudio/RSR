<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" role="img" aria-labelledby="title description">
  <title id="title">RSQ Skill Router — component map</title>
  <desc id="description">A terminal-style component map of the RSQ Skill Router CLI, modules, and local files it operates on.</desc>
  <defs>
    <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#30384a" stroke-width=".45"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 1L8 4.5L0 8Z" fill="#aab5c7"/></marker>
    <marker id="violetArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 1L8 4.5L0 8Z" fill="#a992e8"/></marker>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.h{fill:#edf1f8;font-size:18px;font-weight:500}.sub{fill:#9ba8ba;font-size:11px}.layer{fill:#d7deea;font-size:12px;font-weight:700;letter-spacing:.8px}.label{fill:#eef3fa;font-size:12px;font-weight:700}.copy{fill:#b8c2d1;font-size:11px}.tiny{fill:#718096;font-size:9px;letter-spacing:.5px}.line{fill:none;stroke:#aab5c7;stroke-width:1.4}
    </style>
  </defs>
  <rect width="980" height="660" fill="#252b38"/><rect width="980" height="660" fill="url(#grain)" opacity=".5"/>
  <text x="28" y="35" class="mono h">RSQ SKILL ROUTER · COMPONENT MAP</text>
  <text x="28" y="55" class="mono sub">one CLI coordinates matching, links, and maintenance on the local filesystem</text>
  <line x1="28" y1="76" x2="952" y2="76" stroke="#566174" stroke-width="1"/>

  <text x="28" y="106" class="mono layer">LAYER 0 · AGENT ENTRY</text>
  <rect x="350" y="119" width="280" height="58" rx="2" fill="#293a43" stroke="#6fd6e4" stroke-width="2"/>
  <text x="368" y="144" class="mono label">SKILL.md / PRE-TURN HOOK</text>
  <text x="368" y="163" class="mono copy">passes the current task to the router</text>
  <path d="M490 177V211" class="line" marker-end="url(#arrow)"/>

  <text x="28" y="226" class="mono layer">LAYER 1 · COMMAND SURFACE</text>
  <rect x="305" y="238" width="370" height="72" rx="2" fill="#2d2b43" stroke="#a992e8" stroke-width="2"/>
  <text x="325" y="264" class="mono label">skill-router CLI</text>
  <text x="325" y="284" class="mono copy">install · index · route · reconcile · status · cron</text>
  <text x="325" y="301" class="mono tiny">DRY-RUN OPTIONS · CONFIGURED LIMITS · LOCAL ONLY</text>

  <text x="28" y="349" class="mono layer">LAYER 2 · CORE MODULES</text>
  <!-- connectors behind cards -->
  <path d="M490 310V332H145V365" class="line" marker-end="url(#violetArrow)"/>
  <path d="M490 310V332H375V365" class="line" marker-end="url(#violetArrow)"/>
  <path d="M490 310V332H605V365" class="line" marker-end="url(#violetArrow)"/>
  <path d="M490 310V332H835V365" class="line" marker-end="url(#violetArrow)"/>
  <path d="M145 445V504" class="line" marker-end="url(#arrow)"/>
  <path d="M375 445V504" class="line" marker-end="url(#arrow)"/>
  <path d="M605 445V504" class="line" marker-end="url(#arrow)"/>
  <path d="M835 445V504" class="line" marker-end="url(#arrow)"/>

  <rect x="45" y="365" width="200" height="80" rx="2" fill="#3a3325" stroke="#e6b65c" stroke-width="2"/>
  <text x="61" y="391" class="mono label">AGENT DETECTOR</text>
  <text x="61" y="412" class="mono copy">finds vault + active paths</text>
  <text x="61" y="431" class="mono tiny">agent_detector.py</text>
  <rect x="275" y="365" width="200" height="80" rx="2" fill="#263a35" stroke="#71d9a1" stroke-width="2"/>
  <text x="291" y="391" class="mono label">INDEXER</text>
  <text x="291" y="412" class="mono copy">reads metadata into cache</text>
  <text x="291" y="431" class="mono tiny">indexer.py</text>
  <rect x="505" y="365" width="200" height="80" rx="2" fill="#2d2b43" stroke="#a992e8" stroke-width="2"/>
  <text x="521" y="391" class="mono label">MATCHER</text>
  <text x="521" y="412" class="mono copy">ranks skills for this task</text>
  <text x="521" y="431" class="mono tiny">matcher.py</text>
  <rect x="735" y="365" width="200" height="80" rx="2" fill="#442b3b" stroke="#de7797" stroke-width="2"/>
  <text x="751" y="391" class="mono label">VAULT MANAGER</text>
  <text x="751" y="412" class="mono copy">manages symlinks only</text>
  <text x="751" y="431" class="mono tiny">vault_manager.py</text>

  <text x="28" y="488" class="mono layer">LAYER 3 · LOCAL STATE</text>
  <rect x="45" y="504" width="200" height="78" rx="2" fill="#2d3040" stroke="#e6b65c" stroke-width="1.5"/>
  <text x="61" y="530" class="mono label">config.yaml</text><text x="61" y="550" class="mono copy">paths · limits · retained</text><text x="61" y="568" class="mono tiny">router configuration</text>
  <rect x="275" y="504" width="200" height="78" rx="2" fill="#263a35" stroke="#71d9a1" stroke-width="1.5"/>
  <text x="291" y="530" class="mono label">skills-vault/</text><text x="291" y="550" class="mono copy">read-only source library</text><text x="291" y="568" class="mono tiny">never modified</text>
  <rect x="505" y="504" width="200" height="78" rx="2" fill="#2d3040" stroke="#a992e8" stroke-width="1.5"/>
  <text x="521" y="530" class="mono label">index.json</text><text x="521" y="550" class="mono copy">searchable metadata cache</text><text x="521" y="568" class="mono tiny">local cache</text>
  <rect x="735" y="504" width="200" height="78" rx="2" fill="#293a43" stroke="#6fd6e4" stroke-width="1.5"/>
  <text x="751" y="530" class="mono label">active skills/</text><text x="751" y="550" class="mono copy">task-selected symlinks</text><text x="751" y="568" class="mono tiny">agent reads from here</text>

  <text x="28" y="621" class="mono layer">SAFETY RULE</text>
  <text x="28" y="641" class="mono copy">activate new links first · refuse to touch real skill files · reconcile again on the next task</text>
</svg>
