<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RSQ Skill Router — Vault Architecture</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc; --fg: #172033; --muted: #5b6475; --line: #64748b;
    --neutral: #e2e8f0; --input: #bfdbfe; --process: #c7d2fe;
    --storage: #99f6e4; --external: #fde68a; --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a; --fg: #e5e7eb; --muted: #a3adbd; --line: #94a3b8;
      --neutral: #334155; --input: #1d4ed8; --process: #4338ca;
      --storage: #0f766e; --external: #92400e; --risk: #991b1b;
    }
  }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  main { max-width:980px; margin:32px auto; padding:0 20px; }
  svg { width:100%; height:auto; display:block; }
  .title { font-size:20px; font-weight:650; fill:var(--fg); }
  .label { font-size:14px; font-weight:600; fill:var(--fg); }
  .small { font-size:12px; fill:var(--muted); }
  .node { stroke:var(--line); stroke-width:1; }
  .neutral { fill:var(--neutral); }
  .input { fill:var(--input); }
  .process { fill:var(--process); }
  .storage { fill:var(--storage); }
  .external { fill:var(--external); }
  .risk { fill:var(--risk); }
  .edge { stroke:var(--line); stroke-width:1.5; fill:none; }
  .zone { fill:none; stroke:var(--line); stroke-width:1; stroke-dasharray:6 5; opacity:0.8; }
</style>
<main>
<svg viewBox="0 0 980 480">

  <!-- ── EDGES (behind nodes) ── -->
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--line)"/></marker>
  </defs>

  <!-- Vault → Router (read index) -->
  <path d="M 310,140 L 340,140" class="edge" marker-end="url(#a)"/>

  <!-- Router → Active (activate) -->
  <path d="M 640,260 L 670,260" class="edge" marker-end="url(#a)"/>

  <!-- Active → Router (deactivate) -->
  <path d="M 670,350 L 640,350" class="edge" stroke-dasharray="5,4" marker-end="url(#a)"/>

  <!-- User → Router -->
  <path d="M 420,68 L 420,100" class="edge" marker-end="url(#a)"/>

  <!-- ── ZONES ── -->
  <rect x="20" y="90" width="300" height="370" rx="8" class="zone"/>
  <text x="32" y="80" class="label">VAULT · READ-ONLY</text>

  <rect x="340" y="90" width="300" height="370" rx="8" class="zone"/>
  <text x="352" y="80" class="label">ROUTER ENGINE</text>

  <rect x="660" y="90" width="300" height="370" rx="8" class="zone"/>
  <text x="672" y="80" class="label">ACTIVE · AGENT READS HERE</text>

  <!-- ── USER ── -->
  <rect x="340" y="30" width="160" height="32" rx="6" class="node input"/>
  <text x="420" y="50" text-anchor="middle" class="label">YOU · "write a cold email…"</text>

  <!-- ── VAULT FIELDS ── -->
  <rect x="32" y="105" width="130" height="42" rx="4" class="node storage"/>
  <text x="44" y="122" class="label">coding/</text>
  <text x="44" y="138" class="small">288 skills</text>

  <rect x="172" y="105" width="136" height="42" rx="4" class="node storage"/>
  <text x="184" y="122" class="label">consulting/</text>
  <text x="184" y="138" class="small">120 skills</text>

  <rect x="32" y="155" width="130" height="42" rx="4" class="node storage"/>
  <text x="44" y="172" class="label">finance/</text>
  <text x="44" y="188" class="small">37 skills</text>

  <rect x="172" y="155" width="136" height="42" rx="4" class="node storage"/>
  <text x="184" y="172" class="label">marketing/</text>
  <text x="184" y="188" class="small">43 skills</text>

  <rect x="32" y="205" width="130" height="42" rx="4" class="node storage"/>
  <text x="44" y="222" class="label">sales/</text>
  <text x="44" y="238" class="small">41 skills</text>

  <rect x="172" y="205" width="136" height="42" rx="4" class="node storage"/>
  <text x="184" y="222" class="label">hr/</text>
  <text x="184" y="238" class="small">33 skills</text>

  <rect x="32" y="255" width="130" height="42" rx="4" class="node storage"/>
  <text x="44" y="272" class="label">copywriting/</text>
  <text x="44" y="288" class="small">10 skills</text>

  <rect x="172" y="255" width="136" height="42" rx="4" class="node storage"/>
  <text x="184" y="272" class="label">cs · pm · finops</text>
  <text x="184" y="288" class="small">2 · 1 · 1</text>

  <!-- index.json -->
  <rect x="32" y="315" width="276" height="56" rx="4" class="node external"/>
  <text x="170" y="336" text-anchor="middle" class="label">index.json</text>
  <text x="170" y="354" text-anchor="middle" class="small">name · description · keywords · field</text>

  <!-- config -->
  <rect x="32" y="385" width="276" height="42" rx="4" class="node neutral"/>
  <text x="170" y="406" text-anchor="middle" class="label">config.yaml</text>
  <text x="170" y="420" text-anchor="middle" class="small">always-on list · paths · settings</text>

  <!-- ── ROUTER MODULES ── -->
  <rect x="352" y="105" width="276" height="52" rx="4" class="node process"/>
  <text x="368" y="124" class="label">Indexer</text>
  <text x="368" y="140" class="small">Scans SKILL.md → extracts name, description, keywords</text>

  <rect x="352" y="167" width="276" height="52" rx="4" class="node process"/>
  <text x="368" y="186" class="label">Matcher</text>
  <text x="368" y="202" class="small">Keyword-weighted Jaccard: name ×3, keywords ×2, desc ×1</text>

  <rect x="352" y="229" width="276" height="52" rx="4" class="node process"/>
  <text x="368" y="248" class="label">Vault Manager</text>
  <text x="368" y="264" class="small">Symlink-only operations · atomic reconcile · 5 safety rules</text>

  <rect x="352" y="291" width="276" height="52" rx="4" class="node neutral"/>
  <text x="368" y="310" class="label">Cron Engine</text>
  <text x="368" y="326" class="small">24h sweep · weekly report · crontab setup</text>

  <!-- Always-on lock -->
  <rect x="352" y="355" width="276" height="52" rx="4" class="node input"/>
  <text x="368" y="374" class="label">🔒 Always-On Skills</text>
  <text x="368" y="390" class="small">caveman · un-slop · anti-slop · router · user-selected</text>

  <!-- ── ACTIVE SYMLINKS ── -->
  <rect x="672" y="105" width="276" height="26" rx="4" class="node input"/>
  <text x="684" y="122" class="label">🔒 caveman</text>

  <rect x="672" y="137" width="276" height="26" rx="4" class="node input"/>
  <text x="684" y="154" class="label">🔒 un-slop</text>

  <!-- separator -->
  <line x1="672" y1="177" x2="948" y2="177" stroke="var(--line)" stroke-width="1"/>

  <rect x="672" y="192" width="276" height="26" rx="4" class="node storage"/>
  <text x="684" y="209" class="label">cold-email-4-sequence</text>

  <rect x="672" y="224" width="276" height="26" rx="4" class="node storage"/>
  <text x="684" y="241" class="label">email-writing-frameworks</text>

  <rect x="672" y="256" width="276" height="26" rx="4" class="node storage"/>
  <text x="684" y="273" class="label">sales-sequence-builder</text>

  <rect x="672" y="288" width="276" height="26" rx="4" class="node storage"/>
  <text x="684" y="305" class="label">subject-lines</text>

  <rect x="672" y="320" width="276" height="26" rx="4" class="node storage"/>
  <text x="684" y="337" class="label">list-building</text>

  <!-- Stats -->
  <rect x="672" y="370" width="276" height="42" rx="4" class="node neutral"/>
  <text x="810" y="390" text-anchor="middle" class="label">13 active / 568 in vault</text>
  <text x="810" y="405" text-anchor="middle" class="small">2.3% overhead · 97.7% saved</text>

  <!-- ── EDGE LABELS ── -->
  <text x="324" y="136" class="small">reads</text>
  <text x="654" y="256" class="small">activate</text>
  <text x="654" y="364" class="small">deactivate</text>

  <!-- ── LEGEND ── -->
  <rect x="20" y="464" width="14" height="10" rx="2" class="node storage"/>
  <text x="40" y="473" class="small">vault storage</text>
  <rect x="140" y="464" width="14" height="10" rx="2" class="node process"/>
  <text x="160" y="473" class="small">router engine</text>
  <rect x="280" y="464" width="14" height="10" rx="2" class="node input"/>
  <text x="300" y="473" class="small">always-on</text>
  <rect x="400" y="464" width="14" height="10" rx="2" class="node external"/>
  <text x="420" y="473" class="small">config/index</text>
</svg>
</main>
