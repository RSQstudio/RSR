  <text x="602" y="128" fill="#22d3ee" font-size="9" font-weight="600">🔒 caveman</text>
  <text x="602" y="134" fill="#4b5563" font-size="6">always-on symlink</text>
  <rect x="590" y="142" width="266" height="26" rx="4" fill="#0a1618" stroke="#22d3ee" stroke-width="1"/>
  <text x="602" y="158" fill="#22d3ee" font-size="9" font-weight="600">🔒 un-slop</text>

