<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" role="img" aria-labelledby="title description">
  <title id="title">RSQ Skill Router — vault to active context</title>
  <desc id="description">A terminal-style process map showing a task being matched against a read-only skill vault and producing a small active skill set.</desc>
  <defs>
    <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#30384a" stroke-width=".45"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 1L8 4.5L0 8Z" fill="#aab5c7"/></marker>
    <marker id="greenArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 1L8 4.5L0 8Z" fill="#71d9a1"/></marker>
    <marker id="amberArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 1L8 4.5L0 8Z" fill="#e6b65c"/></marker>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.h{fill:#edf1f8;font-size:18px;font-weight:500}.sub{fill:#9ba8ba;font-size:11px}.layer{fill:#d7deea;font-size:12px;font-weight:700;letter-spacing:.8px}.label{fill:#eef3fa;font-size:12px;font-weight:700}.copy{fill:#b8c2d1;font-size:11px}.note{fill:#8997aa;font-size:10px}.tiny{fill:#718096;font-size:9px;letter-spacing:.5px}.line{fill:none;stroke:#aab5c7;stroke-width:1.4}.dash{fill:none;stroke:#8e9bad;stroke-width:1.2;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="980" height="660" fill="#252b38"/>
  <rect width="980" height="660" fill="url(#grain)" opacity=".5"/>

  <text x="28" y="35" class="mono h">RSQ SKILL ROUTER</text>
  <text x="28" y="55" class="mono sub">task message → match skills → load a small working set</text>
  <line x1="28" y1="76" x2="952" y2="76" stroke="#566174" stroke-width="1"/>

  <text x="28" y="106" class="mono layer">LAYER 0 · CURRENT TASK</text>
  <rect x="350" y="120" width="280" height="58" rx="2" fill="#29283d" stroke="#d68dc6" stroke-width="2"/>
  <text x="368" y="144" class="mono label">YOU · THIS JOB</text>
  <text x="368" y="163" class="mono copy">“build a production deployment plan”</text>

  <path d="M490 178V211" class="line" marker-end="url(#arrow)"/>
  <text x="28" y="226" class="mono layer">LAYER 1 · MATCHING</text>

  <!-- connectors behind cards -->
  <path d="M260 316H320" class="line" marker-end="url(#arrow)"/>
  <path d="M720 287H660" class="line" marker-end="url(#amberArrow)"/>
  <path d="M490 359V398" class="line" marker-end="url(#greenArrow)"/>
  <path d="M490 495V528" class="line" marker-end="url(#arrow)"/>
  <path d="M490 546H158V563" class="line" marker-end="url(#arrow)"/>
  <path d="M490 546V563" class="line" marker-end="url(#arrow)"/>
  <path d="M490 546H822V563" class="line" marker-end="url(#arrow)"/>

  <rect x="40" y="267" width="220" height="98" rx="2" fill="#29323a" stroke="#6ec7b1" stroke-width="2"/>
  <text x="56" y="292" class="mono label">READ-ONLY VAULT</text>
  <text x="56" y="312" class="mono copy">all skill domains live here</text>
  <text x="56" y="329" class="mono copy">source files never change</text>
  <text x="56" y="349" class="mono tiny">SKILL.md · descriptions · keywords</text>

  <rect x="320" y="245" width="340" height="114" rx="2" fill="#2c2b42" stroke="#a992e8" stroke-width="2"/>
  <text x="340" y="271" class="mono label">1 · MATCH + RANK</text>
  <text x="340" y="292" class="mono copy">indexer reads vault metadata</text>
  <text x="340" y="310" class="mono copy">matcher scores the current task</text>
  <text x="340" y="328" class="mono copy">limits keep the working set bounded</text>
  <text x="340" y="346" class="mono tiny">INDEXER → MATCHER → VAULT MANAGER</text>

  <rect x="720" y="257" width="220" height="60" rx="2" fill="#3a3325" stroke="#e6b65c" stroke-width="2"/>
  <text x="736" y="281" class="mono label">CONFIG</text>
  <text x="736" y="301" class="mono copy">limits · paths · always-keep</text>

  <text x="28" y="392" class="mono layer">LAYER 2 · ACTIVE CONTEXT</text>
  <rect x="320" y="398" width="340" height="97" rx="2" fill="#263a35" stroke="#71d9a1" stroke-width="2.5"/>
  <text x="340" y="425" class="mono label">2 · ACTIVE SKILLS/</text>
  <text x="340" y="447" class="mono copy">task-selected symlinks only</text>
  <text x="340" y="466" class="mono copy">the agent reads this small set</text>
  <text x="340" y="484" class="mono tiny">VAULT REMAINS THE SOURCE OF TRUTH</text>

  <text x="28" y="535" class="mono layer">RESULT · CONTEXT WITHOUT THE BLOAT</text>
  <rect x="48" y="563" width="220" height="58" rx="2" fill="#2d3040" stroke="#a992e8" stroke-width="1.5"/>
  <text x="64" y="587" class="mono label">FOCUSED</text><text x="64" y="606" class="mono copy">only relevant skills load</text>
  <rect x="380" y="563" width="220" height="58" rx="2" fill="#2d3040" stroke="#71d9a1" stroke-width="1.5"/>
  <text x="396" y="587" class="mono label">SAFE</text><text x="396" y="606" class="mono copy">real files stay untouched</text>
  <rect x="712" y="563" width="220" height="58" rx="2" fill="#2d3040" stroke="#d68dc6" stroke-width="1.5"/>
  <text x="728" y="587" class="mono label">ADAPTIVE</text><text x="728" y="606" class="mono copy">next task reconciles again</text>

  <text x="28" y="646" class="mono tiny">FLOW: NEW TASK → RE-RANK → REPLACE ONLY THE ACTIVE SYMLINKS</text>
</svg>
