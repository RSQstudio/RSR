  <rect x="334" y="356" width="222" height="52" rx="5" fill="#111118" stroke="#6b7280" stroke-width="1.5"/>
  <text x="348" y="374" fill="#9ca3af" font-size="10" font-weight="600">Cron Engine</text>
  <text x="348" y="390" fill="#9ca3af" font-size="8">24h sweep — auto-vault newly installed skills</text>
  <text x="348" y="402" fill="#6b7280" font-size="7">Weekly report — usage analytics + token savings + health checks</text>

  <!-- ── ACTIVE ── -->
  <rect x="578" y="60" width="290" height="360" rx="10" fill="#111118" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="590" y="82" fill="#34d399" font-size="12" font-weight="700">ACTIVE · AGENT READS HERE</text>
  <text x="590" y="97" fill="#6b7280" font-size="9">~/.hermes/skills/ · symlinks only · 5–15 at a time</text>

  <!-- Locked -->
