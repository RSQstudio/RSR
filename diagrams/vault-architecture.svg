  <text x="470" y="39" text-anchor="middle" fill="#22d3ee" font-size="9" font-weight="600">YOU — "write a cold email…"</text>
  <line x1="470" y1="48" x2="470" y2="60" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>

