  <line x1="590" y1="290" x2="568" y2="290" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowR)"/>
  <text x="556" y="304" fill="#fb7185" font-size="7">DEACTIVATE</text>

