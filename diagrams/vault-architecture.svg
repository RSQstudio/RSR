  <text x="723" y="176" fill="#374151" font-size="7">── routed by matcher ──</text>

  <!-- Routed skill 1 -->
  <rect x="590" y="192" width="266" height="26" rx="4" fill="#0a1a14" stroke="#34d399" stroke-width="1.5"/>
  <text x="602" y="208" fill="#34d399" font-size="9" font-weight="600">cold-email-4-sequence</text>
  <text x="602" y="214" fill="#4b5563" font-size="6">↗ vault/sales/</text>

  <rect x="590" y="222" width="266" height="26" rx="4" fill="#0a1a14" stroke="#34d399" stroke-width="1.5"/>
