<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">RSQ Skill Router — Vault to Context Flow</title>
  <desc id="desc">A dark terminal-style diagram showing a read-only skill vault, routing engine, and the active skill context read by an AI agent.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#17233a" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b5873"/><stop offset="1" stop-color="#12314f"/></linearGradient>
    <linearGradient id="violetGlow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#46348b"/><stop offset="1" stop-color="#24285f"/></linearGradient>
    <linearGradient id="greenGlow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c604e"/><stop offset="1" stop-color="#123d44"/></linearGradient>
    <linearGradient id="amberGlow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b5317"/><stop offset="1" stop-color="#473419"/></linearGradient>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9Z" fill="#41d8ff"/></marker>
    <marker id="arrowViolet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9Z" fill="#b39cff"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9Z" fill="#55e6b0"/></marker>
    <style>
      .sans{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.kicker{fill:#7f94b6;font-size:12px;font-weight:700;letter-spacing:2.3px}.title{fill:#eef5ff;font-size:29px;font-weight:700;letter-spacing:-.4px}.sub{fill:#9eb0ca;font-size:14px}.zone{fill:#0c172a;fill-opacity:.78;stroke:#293b58;stroke-width:1.2}.zoneTitle{fill:#d9e7fb;font-size:14px;font-weight:700;letter-spacing:1.2px}.zoneMeta{fill:#6f88ac;font-size:11px;letter-spacing:1.4px}.label{fill:#e8f0ff;font-size:14px;font-weight:650}.small{fill:#a6b9d5;font-size:11.5px}.tiny{fill:#7187aa;font-size:10px;letter-spacing:.6px}.tag{font-size:10px;font-weight:700;letter-spacing:1.1px}.edgeLabel{fill:#91a9cb;font-size:10px;letter-spacing:.8px}.rule{stroke:#29405f;stroke-width:1}.divider{stroke:#1e304c;stroke-width:1}.card{stroke-width:1.25}.num{fill:#96a8c3;font-size:11px;font-weight:700;letter-spacing:1.3px}
    </style>
  </defs>

  <rect width="1200" height="700" fill="#07101f"/>
  <rect width="1200" height="700" fill="url(#grid)" opacity=".72"/>
  <rect x="20" y="20" width="1160" height="660" rx="18" fill="none" stroke="#20324f"/>

  <circle cx="58" cy="61" r="5" fill="#55e6b0"/>
  <text x="74" y="65" class="sans kicker">RSQ SKILL ROUTER / SYSTEM MAP</text>
  <text x="54" y="111" class="sans title">From vault to focused context.</text>
  <text x="54" y="138" class="sans sub">Keep the full skill library intact. Load only the capability set the current task needs.</text>
  <line x1="54" y1="163" x2="1146" y2="163" class="rule"/>

  <!-- Flow connectors: rendered first so they remain behind cards. -->
  <path d="M352 549H410V395H465" fill="none" stroke="#55e6b0" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M598 354V435" fill="none" stroke="#41d8ff" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M598 421V435" fill="none" stroke="#b39cff" stroke-width="2" marker-end="url(#arrowViolet)"/>
  <path d="M598 487V501" fill="none" stroke="#b39cff" stroke-width="2" marker-end="url(#arrowViolet)"/>
  <path d="M732 536H845" fill="none" stroke="#55e6b0" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M1035 573C1035 625 752 633 706 571" fill="none" stroke="#8da2c2" stroke-width="1.4" stroke-dasharray="5 6" marker-end="url(#arrowViolet)"/>
  <text x="370" y="385" class="mono edgeLabel">BUILD INDEX</text>
  <text x="612" y="388" class="mono edgeLabel">TASK</text>
  <text x="612" y="431" class="mono edgeLabel">INDEX</text>
  <text x="765" y="526" class="mono edgeLabel">SYMLINK</text>
  <text x="850" y="650" class="mono edgeLabel">RECONCILE ON NEXT TASK</text>

  <!-- Stage 1: Vault -->
  <rect x="45" y="198" width="330" height="408" rx="14" class="zone"/>
  <text x="68" y="229" class="mono num">01 / STORAGE LAYER</text>
  <text x="68" y="255" class="sans zoneTitle">READ-ONLY SKILL VAULT</text>
  <text x="68" y="275" class="mono zoneMeta">PERSISTENT LIBRARY · NEVER MUTATED</text>
  <line x1="68" y1="294" x2="352" y2="294" class="divider"/>

  <rect x="68" y="320" width="128" height="54" rx="8" fill="url(#greenGlow)" stroke="#55e6b0" class="card"/>
  <text x="84" y="344" class="mono label">coding/</text><text x="84" y="363" class="sans small">build · debug · ship</text>
  <rect x="211" y="320" width="141" height="54" rx="8" fill="url(#greenGlow)" stroke="#55e6b0" class="card"/>
  <text x="227" y="344" class="mono label">consulting/</text><text x="227" y="363" class="sans small">analysis · strategy</text>
  <rect x="68" y="389" width="128" height="54" rx="8" fill="url(#greenGlow)" stroke="#55e6b0" class="card"/>
  <text x="84" y="413" class="mono label">marketing/</text><text x="84" y="432" class="sans small">campaign · content</text>
  <rect x="211" y="389" width="141" height="54" rx="8" fill="url(#greenGlow)" stroke="#55e6b0" class="card"/>
  <text x="227" y="413" class="mono label">sales/</text><text x="227" y="432" class="sans small">pipeline · outreach</text>
  <rect x="68" y="458" width="284" height="38" rx="8" fill="#10283a" stroke="#47718a" class="card"/>
  <text x="84" y="482" class="mono small">finance · hr · copywriting · operations · more</text>
  <rect x="68" y="519" width="284" height="60" rx="8" fill="url(#amberGlow)" stroke="#f5b94c" class="card"/>
  <text x="84" y="544" class="mono label">index.json</text>
  <text x="84" y="564" class="sans small">names · descriptions · keywords · fields</text>

  <!-- Stage 2: engine -->
  <rect x="442" y="198" width="313" height="408" rx="14" class="zone"/>
  <text x="465" y="229" class="mono num">02 / CONTROL PLANE</text>
  <text x="465" y="255" class="sans zoneTitle">ROUTING ENGINE</text>
  <text x="465" y="275" class="mono zoneMeta">DETERMINISTIC · ATOMIC · REVERSIBLE</text>
  <line x1="465" y1="294" x2="732" y2="294" class="divider"/>

  <rect x="493" y="306" width="210" height="48" rx="9" fill="url(#cyanGlow)" stroke="#41d8ff" class="card"/>
  <text x="598" y="327" text-anchor="middle" class="mono tag" fill="#9eeeff">TASK MESSAGE</text>
  <text x="598" y="345" text-anchor="middle" class="sans small">“Build a production deployment plan”</text>
  <rect x="465" y="369" width="267" height="52" rx="9" fill="url(#violetGlow)" stroke="#b39cff" class="card"/>
  <text x="484" y="392" class="mono label">INDEXER</text><text x="484" y="410" class="sans small">Catalogues vault metadata once.</text>
  <rect x="465" y="435" width="267" height="52" rx="9" fill="url(#violetGlow)" stroke="#b39cff" class="card"/>
  <text x="484" y="458" class="mono label">MATCHER</text><text x="484" y="476" class="sans small">Ranks skills against task intent.</text>
  <rect x="465" y="501" width="267" height="70" rx="9" fill="url(#violetGlow)" stroke="#b39cff" class="card"/>
  <text x="484" y="525" class="mono label">VAULT MANAGER</text><text x="484" y="544" class="sans small">Activates first. Deactivates safely.</text><text x="484" y="560" class="mono tiny">REAL FILES ARE NEVER TOUCHED</text>
  <text x="465" y="594" class="mono tiny">CONFIG: LIMITS · ALWAYS-KEEP · PATHS</text>

  <!-- Stage 3: active context -->
  <rect x="822" y="198" width="333" height="408" rx="14" class="zone"/>
  <text x="845" y="229" class="mono num">03 / RUNTIME CONTEXT</text>
  <text x="845" y="255" class="sans zoneTitle">ACTIVE SKILLS DIRECTORY</text>
  <text x="845" y="275" class="mono zoneMeta">THE AGENT READS ONLY THIS SET</text>
  <line x1="845" y1="294" x2="1132" y2="294" class="divider"/>

  <rect x="845" y="320" width="287" height="58" rx="9" fill="url(#cyanGlow)" stroke="#41d8ff" class="card"/>
  <text x="864" y="344" class="mono label">ALWAYS-ON</text><text x="864" y="363" class="sans small">router · safety controls · operator picks</text>
  <text x="845" y="409" class="mono tiny">TASK-SELECTED SYMLINKS</text>
  <rect x="845" y="425" width="287" height="37" rx="8" fill="url(#greenGlow)" stroke="#55e6b0" class="card"/>
  <text x="864" y="449" class="mono small">vps-service-deployment</text>
  <rect x="845" y="470" width="287" height="37" rx="8" fill="url(#greenGlow)" stroke="#55e6b0" class="card"/>
  <text x="864" y="494" class="mono small">docker-operations</text>
  <rect x="845" y="515" width="287" height="37" rx="8" fill="url(#greenGlow)" stroke="#55e6b0" class="card"/>
  <text x="864" y="539" class="mono small">nginx-reverse-proxy</text>
  <text x="845" y="578" class="sans small">Small context. Full task coverage.</text>

  <line x1="54" y1="635" x2="1146" y2="635" class="rule"/>
  <text x="54" y="659" class="mono tiny">INVARIANT: THE VAULT RETAINS THE SOURCE OF TRUTH. ACTIVE SKILLS ARE DISPOSABLE LINKS.</text>
  <circle cx="1033" cy="655" r="4" fill="#55e6b0"/><text x="1044" y="659" class="mono tiny">SAFE BY DESIGN</text>
</svg>
