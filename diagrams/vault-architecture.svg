  <rect x="590" y="352" width="266" height="56" rx="5" fill="#0a1a14" stroke="#34d399" stroke-width="1"/>
  <text x="723" y="374" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700">13 active / 568 in vault</text>
  <text x="723" y="392" text-anchor="middle" fill="#6b7280" font-size="8">2.3% overhead · 97.7% saved</text>

