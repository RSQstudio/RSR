  <text x="602" y="244" fill="#4b5563" font-size="6">↗ vault/copywriting/</text>

  <rect x="590" y="252" width="266" height="26" rx="4" fill="#0a1a14" stroke="#34d399" stroke-width="1.5"/>
  <text x="602" y="268" fill="#34d399" font-size="9" font-weight="600">sales-sequence-builder</text>
  <text x="602" y="274" fill="#4b5563" font-size="6">↗ vault/sales/</text>

  <rect x="590" y="282" width="266" height="26" rx="4" fill="#0a1a14" stroke="#34d399" stroke-width="1.5"/>
  <text x="602" y="298" fill="#34d399" font-size="9" font-weight="600">subject-lines</text>
  <text x="602" y="304" fill="#4b5563" font-size="6">↗ vault/copywriting/</text>

  <rect x="590" y="312" width="266" height="26" rx="4" fill="#0a1a14" stroke="#34d399" stroke-width="1.5"/>
  <text x="602" y="328" fill="#34d399" font-size="9" font-weight="600">list-building</text>
  <text x="602" y="334" fill="#4b5563" font-size="6">↗ vault/sales/</text>

