<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" style="background:#0a0a0f;font-family:system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9ca3af"/>
    </marker>
    <marker id="arrowE" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34d399"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fb7185"/>
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="440" y="28" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">RSQ SKILL ROUTER — HOW IT WORKS</text>
  <text x="440" y="44" text-anchor="middle" fill="#6b7280" font-size="10">intelligent skill loading · 568 skills in vault · only 5–15 active at any time</text>

  <!-- ── VAULT ── -->
  <rect x="12" y="60" width="300" height="360" rx="10" fill="#111118" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="24" y="82" fill="#a78bfa" font-size="12" font-weight="700">VAULT · READ-ONLY</text>
  <text x="24" y="97" fill="#6b7280" font-size="9">568 skills · 10 fields · never modified by router</text>

  <!-- Field boxes -->
  <rect x="24" y="112" width="135" height="34" rx="4" fill="#111118" stroke="#a78bfa" stroke-width="1"/>
  <text x="36" y="128" fill="#e5e7eb" font-size="10" font-weight="600">coding/</text><text x="88" y="128" fill="#6b7280" font-size="9">288</text>
  <text x="36" y="140" fill="#4b5563" font-size="7">python · react · docker · go…</text>

  <rect x="165" y="112" width="135" height="34" rx="4" fill="#111118" stroke="#a78bfa" stroke-width="1"/>
  <text x="177" y="128" fill="#e5e7eb" font-size="10" font-weight="600">consulting/</text><text x="258" y="128" fill="#6b7280" font-size="9">120</text>
  <text x="177" y="140" fill="#4b5563" font-size="7">MECE · M&amp;A · strategy…</text>

  <rect x="24" y="154" width="135" height="34" rx="4" fill="#111118" stroke="#a78bfa" stroke-width="1"/>
  <text x="36" y="170" fill="#e5e7eb" font-size="10" font-weight="600">finance/</text><text x="88" y="170" fill="#6b7280" font-size="9">37</text>
  <text x="36" y="182" fill="#4b5563" font-size="7">P&amp;L · CFO · tax · runway…</text>

  <rect x="165" y="154" width="135" height="34" rx="4" fill="#111118" stroke="#a78bfa" stroke-width="1"/>
  <text x="177" y="170" fill="#e5e7eb" font-size="10" font-weight="600">marketing/</text><text x="258" y="170" fill="#6b7280" font-size="9">43</text>
  <text x="177" y="182" fill="#4b5563" font-size="7">SEO · launch · content…</text>

  <rect x="24" y="196" width="135" height="34" rx="4" fill="#111118" stroke="#a78bfa" stroke-width="1"/>
  <text x="36" y="212" fill="#e5e7eb" font-size="10" font-weight="600">sales/</text><text x="88" y="212" fill="#6b7280" font-size="9">41</text>
  <text x="36" y="224" fill="#4b5563" font-size="7">cold email · CRM · ABM…</text>

  <rect x="165" y="196" width="135" height="34" rx="4" fill="#111118" stroke="#a78bfa" stroke-width="1"/>
  <text x="177" y="212" fill="#e5e7eb" font-size="10" font-weight="600">hr/</text><text x="200" y="212" fill="#6b7280" font-size="9">33</text>
  <text x="177" y="224" fill="#4b5563" font-size="7">recruiting · onboarding…</text>

  <rect x="24" y="238" width="135" height="34" rx="4" fill="#111118" stroke="#a78bfa" stroke-width="1"/>
  <text x="36" y="254" fill="#e5e7eb" font-size="10" font-weight="600">copywriting/</text><text x="122" y="254" fill="#6b7280" font-size="9">10</text>

  <rect x="165" y="238" width="135" height="34" rx="4" fill="#111118" stroke="#a78bfa" stroke-width="1"/>
  <text x="177" y="254" fill="#e5e7eb" font-size="10" font-weight="600">cs / pm / finops</text>
  <text x="177" y="266" fill="#4b5563" font-size="7">2 · 1 · 1</text>

  <!-- index.json -->
  <rect x="24" y="292" width="276" height="50" rx="5" fill="#1a1a12" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="162" y="312" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">index.json</text>
  <text x="162" y="328" text-anchor="middle" fill="#6b7280" font-size="8">name · description · keywords · field · creator — rebuilt on change</text>

  <!-- Config -->
  <rect x="24" y="352" width="276" height="36" rx="4" fill="#1a1410" stroke="#fbbf24" stroke-width="1"/>
  <text x="162" y="372" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">config.yaml</text>
  <text x="162" y="384" text-anchor="middle" fill="#6b7280" font-size="7">always-on list · paths · matching settings · written by installer</text>

  <!-- ── ROUTER ENGINE ── -->
  <rect x="322" y="60" width="246" height="360" rx="10" fill="#111118" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="334" y="82" fill="#fbbf24" font-size="12" font-weight="700">ROUTER ENGINE</text>
  <text x="334" y="97" fill="#6b7280" font-size="9">~800 token overhead · runs via SKILL.md on every turn</text>

  <!-- Indexer -->
  <rect x="334" y="112" width="222" height="52" rx="5" fill="#111118" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="348" y="130" fill="#fbbf24" font-size="10" font-weight="600">Indexer</text>
  <text x="348" y="146" fill="#9ca3af" font-size="8">Scans SKILL.md files → extracts name, description, keywords</text>
  <text x="348" y="158" fill="#6b7280" font-size="7">Builds the searchable index.json</text>

  <!-- Matcher -->
  <rect x="334" y="172" width="222" height="52" rx="5" fill="#111118" stroke="#fb923c" stroke-width="1.5"/>
  <text x="348" y="190" fill="#fb923c" font-size="10" font-weight="600">Matcher</text>
  <text x="348" y="206" fill="#9ca3af" font-size="8">Keyword-weighted Jaccard scoring: name ×3 · keywords ×2 · desc ×1</text>
  <text x="348" y="218" fill="#6b7280" font-size="7">Field-level intent signals for fast routing</text>

  <!-- Vault Manager -->
  <rect x="334" y="232" width="222" height="52" rx="5" fill="#111118" stroke="#fb7185" stroke-width="1.5"/>
  <text x="348" y="250" fill="#fb7185" font-size="10" font-weight="600">Vault Manager</text>
  <text x="348" y="266" fill="#9ca3af" font-size="8">Symlink-only operations · atomic reconcile · 5 safety rules</text>
  <text x="348" y="278" fill="#6b7280" font-size="7">Agent never sees vault files — only symlinks in active/</text>

  <!-- Always-on lock -->
  <rect x="334" y="296" width="222" height="50" rx="5" fill="#111118" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="348" y="314" fill="#22d3ee" font-size="9" font-weight="600">🔒 ALWAYS-ON</text>
  <text x="348" y="330" fill="#6b7280" font-size="7">caveman · un-slop · anti-slop · rsq-skill-router</text>
  <text x="348" y="342" fill="#6b7280" font-size="7">user-selected skills · immune to deactivation</text>

