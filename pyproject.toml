[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "rsq-skill-router"
version = "0.1.0"
description = "Intelligent skill loading for AI coding agents — keep your agent fast by routing skills on-demand"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "RSQ"}]
keywords = ["ai", "agent", "skills", "claude-code", "codex", "cursor", "hermes", "skill-router"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/RED-NTWRK/RSR"
Repository = "https://github.com/RED-NTWRK/RSR.git"

[project.scripts]
skill-router = "src.skill_router_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["*.md", "*.yaml", "*.yml", "*.json"]