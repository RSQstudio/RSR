# Skill Router Configuration
# Optional YAML settings for package-based installs. The bootstrap installer writes config.json.

# ── Paths ──
paths:
  vault: "~/.hermes/skills-vault"      # Where ALL skills live (never modified by router)
  active: "~/.hermes/skills"           # Where agent loads skills FROM (router manages symlinks here)
  index_cache: "~/.cache/skill-router/index.json"  # Pre-computed skill index

# ── Matching Strategy ──
matching:
  strategy: "keyword"           # Local deterministic matcher
  max_active_skills: 15         # Hard cap on how many skills in active/
  min_confidence: 0.3           # Minimum match score to consider a skill (0.0-1.0)

# ── Always-Keep Skills ──
# These are NEVER deactivated. Always in active/ alongside routed skills.
# The installer preselects caveman and anti-slop when they are installed.
always_keep:
  - caveman
  - rsq-skill-router           # The router itself — so agent always has routing instructions
